    <circle cx="566" cy="382" r="7"/><circle cx="598" cy="372" r="6"/><circle cx="624" cy="396" r="7"/>
    <circle cx="654" cy="386" r="6"/><circle cx="680" cy="408" r="7"/><circle cx="712" cy="400" r="6"/>
    <circle cx="488" cy="394" r="6"/><circle cx="554" cy="414" r="6"/><circle cx="618" cy="430" r="6"/>
