<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Line drawing of a delivery route as a closed loop of road running out from the grow shed and back, with four houses along the loop and a cooler bag set beside each one, and three more houses off to the side that no road reaches">
  <rect width="1200" height="630" fill="#f5ead3"/>

  <!-- the route: one closed loop that leaves home and comes back -->
  <path d="M210 400 L 230 300 Q 236 268, 274 262 L 470 236 Q 500 232, 528 240 L 700 250 Q 760 254, 812 272 L 900 306 Q 946 324, 944 366 L 938 400 Q 934 440, 880 452 L 700 470 Q 640 476, 580 474 L 380 466 Q 300 462, 258 448 Q 214 434, 210 400 Z"
