<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Cross-section line drawing of a mowed field with cut stalks standing above the soil line, stems lying flat on the surface, scattered seed on top of the residue, and roots below ground carrying small round nodules">
