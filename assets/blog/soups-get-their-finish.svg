    <path d="M310 408 C 306 390 312 374 326 362"/>
    <ellipse cx="316" cy="352" rx="28" ry="13" transform="rotate(-20 316 352)"/>
    <ellipse cx="368" cy="358" rx="28" ry="13" transform="rotate(20 368 358)"/>
