<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Line drawing of a small shed with a sun overhead, a portable floor air conditioner venting two hoses out a window, and a rack of microgreen trays under light bars inside">
  <rect width="1200" height="630" fill="#f5ead3"/>
  <g fill="none" stroke="#3a5a2a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">

    <!-- sun, upper left -->
    <g stroke="#8a7e3a">
      <circle cx="128" cy="112" r="42"/>
      <path d="M128 40 V 14 M128 210 v 26 M56 112 H 30 M200 112 h 26"/>
      <path d="M77 61 L 59 43 M179 163 l 18 18 M179 61 L 197 43 M77 163 l -18 18"/>
    </g>

    <!-- heat rising off the roof -->
    <g stroke="#6b2a2f" stroke-width="4">
      <path d="M700 122 c -14 -16 14 -26 0 -42 c -14 -16 14 -26 0 -40"/>
      <path d="M772 104 c -14 -16 14 -26 0 -42 c -14 -16 14 -26 0 -40"/>
      <path d="M844 88 c -14 -16 14 -26 0 -42 c -14 -16 14 -26 0 -40"/>
    </g>

    <!-- ground -->
    <path d="M60 560 H 1140" stroke="#5c4633" stroke-width="6"/>

    <!-- shed shell: roof and walls, cut away at the front, window gap in the right wall -->
    <g stroke="#5c4633" stroke-width="7">
      <path d="M150 212 L 590 108 L 1030 212"/>
      <path d="M210 212 V 560"/>
      <path d="M970 212 V 236 M970 366 V 560"/>
      <path d="M210 212 H 970"/>
    </g>

    <!-- window the hoses run out of -->
    <g stroke="#5c4633" stroke-width="5">
      <rect x="944" y="236" width="52" height="130" rx="4"/>
    </g>

    <!-- rack uprights -->
    <path d="M280 262 V 560 M740 262 V 560" stroke-width="6"/>

    <!-- shelves -->
    <path d="M280 300 H 740 M280 380 H 740 M280 460 H 740 M280 540 H 740"/>

    <!-- light bars under the shelves, with glow ticks -->
    <g stroke="#8a7e3a" stroke-width="4">
      <path d="M320 314 H 700 M320 394 H 700 M320 474 H 700"/>
      <path d="M370 326 v 10 M470 326 v 10 M570 326 v 10 M660 326 v 10"/>
      <path d="M370 406 v 10 M470 406 v 10 M570 406 v 10 M660 406 v 10"/>
      <path d="M370 486 v 10 M470 486 v 10 M570 486 v 10 M660 486 v 10"/>
    </g>

    <!-- trays of greens on three shelves -->
    <g stroke-width="4">
      <path d="M310 380 v -16 h 190 v 16 M520 380 v -16 h 190 v 16"/>
      <path d="M345 364 v -10 M385 364 v -13 M425 364 v -10 M465 364 v -13 M555 364 v -10 M595 364 v -13 M635 364 v -10 M675 364 v -13"/>

      <path d="M310 460 v -16 h 190 v 16 M520 460 v -16 h 190 v 16"/>
      <path d="M345 444 v -10 M385 444 v -13 M425 444 v -10 M465 444 v -13 M555 444 v -10 M595 444 v -13 M635 444 v -10 M675 444 v -13"/>

      <path d="M310 540 v -16 h 190 v 16 M520 540 v -16 h 190 v 16"/>
      <path d="M345 524 v -10 M385 524 v -13 M425 524 v -10 M465 524 v -13 M555 524 v -10 M595 524 v -13 M635 524 v -10 M675 524 v -13"/>
    </g>

    <!-- portable floor air conditioner -->
    <g stroke="#1f2419">
      <rect x="790" y="372" width="124" height="188" rx="10"/>
      <path d="M810 402 H 894 M810 420 H 894 M810 438 H 894" stroke-width="4"/>
      <circle cx="852" cy="486" r="9" stroke-width="4"/>
    </g>

    <!-- two hoses running from the unit out the window -->
    <g stroke="#1f2419" stroke-width="5">
      <path d="M818 372 C 818 306, 878 274, 944 274"/>
      <path d="M884 372 C 884 336, 898 326, 944 326"/>
      <g stroke-width="3">
        <path d="M816 330 h 24 M833 309 h 24 M856 278 v 22 M898 268 v 22"/>
        <path d="M875 350 h 24 M897 326 v 20 M915 318 v 20"/>
      </g>
    </g>

    <!-- warm air leaving through the window -->
    <g stroke="#8a7e3a" stroke-width="4">
      <path d="M1014 274 c 16 6 24 -6 40 0"/>
      <path d="M1014 326 c 16 6 24 -6 40 0"/>
    </g>
  </g>
</svg>
