<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Line drawing of a stack of empty growing trays beside one tray being sprayed by a hose nozzle, with a pump sprayer standing to the side and water droplets in the air">
  <rect width="1200" height="630" fill="#f5ead3"/>

  <!-- stack of empty trays -->
  <g fill="none" stroke="#1f2419" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(250,516)">
      <path d="M-150 0 H 150 L 136 42 H -136 Z"/>
      <path d="M-140 15 H 140"/>
    </g>
    <g transform="translate(242,464)">
      <path d="M-150 0 H 150 L 136 42 H -136 Z"/>
      <path d="M-140 15 H 140"/>
    </g>
    <g transform="translate(256,412)">
      <path d="M-150 0 H 150 L 136 42 H -136 Z"/>
      <path d="M-140 15 H 140"/>
    </g>
    <g transform="translate(244,360)">
      <path d="M-150 0 H 150 L 136 42 H -136 Z"/>
      <path d="M-140 15 H 140"/>
    </g>
    <g transform="translate(254,308)">
      <path d="M-150 0 H 150 L 136 42 H -136 Z"/>
      <path d="M-140 15 H 140"/>
    </g>
  </g>

  <!-- the tray being sprayed, sitting flat on the bench -->
  <g fill="none" stroke="#1f2419" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(712,516)">
      <path d="M-150 0 H 150 L 136 42 H -136 Z"/>
      <path d="M-140 15 H 140"/>
    </g>
  </g>

  <!-- hose running in from the upper right, to a nozzle -->
  <g fill="none" stroke="#5c4633" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1194 128 C 1122 140 1030 178 962 250"/>
  </g>
  <g transform="translate(910,300) rotate(-45)">
    <g fill="none" stroke="#5c4633" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 0 H 52 V 26 H 0 Z"/>
      <path d="M0 5 L -26 10 V 18 L 0 22 Z"/>
      <path d="M14 26 L 8 46 H 26 L 20 26"/>
    </g>
  </g>

  <!-- spray fanning from the nozzle down onto the tray -->
  <g fill="none" stroke="#8a7e3a" stroke-width="5" stroke-linecap="round">
    <path d="M890 330 L 812 462 M894 334 L 756 476 M898 338 L 702 490 M902 342 L 648 500"/>
  </g>

  <!-- droplets in the air and coming off the rim -->
  <g fill="none" stroke="#8a7e3a" stroke-width="5" stroke-linecap="round">
    <path d="M836 386 l -12 10 M796 424 l -12 10 M852 430 l -12 10 M760 452 l -12 10
             M700 466 l -12 10 M866 470 l -12 10"/>
    <circle cx="782" cy="392" r="5"/>
    <circle cx="736" cy="430" r="5"/>
    <circle cx="812" cy="486" r="4"/>
    <circle cx="672" cy="470" r="4"/>
    <circle cx="608" cy="492" r="5"/>
  </g>

  <!-- pump sprayer standing to the side -->
  <g fill="none" stroke="#5c4633" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <rect x="1042" y="432" width="94" height="126" rx="12"/>
    <path d="M1050 466 H 1128"/>
    <path d="M1089 432 V 372"/>
    <path d="M1058 372 H 1120"/>
    <path d="M1136 480 C 1168 498 1176 526 1164 552"/>
  </g>

  <!-- spent bits left on the bench -->
  <g fill="none" stroke="#3a5a2a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M480 550 C 492 540 508 540 518 548"/>
    <path d="M912 552 C 924 542 940 542 950 550"/>
    <path d="M978 546 C 990 536 1006 536 1016 544"/>
  </g>

  <!-- bench line -->
  <path d="M70 562 H 1170" fill="none" stroke="#5c4633" stroke-width="5" stroke-linecap="round"/>
</svg>
