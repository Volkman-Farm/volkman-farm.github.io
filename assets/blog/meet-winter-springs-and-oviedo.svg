    <g fill="none" stroke="#3a5a2a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-14 -24 C -18 -38 -14 -48 -6 -54"/>
      <path d="M2 -24 C 2 -40 6 -50 14 -56"/>
      <path d="M16 -24 C 20 -36 26 -42 34 -46"/>
