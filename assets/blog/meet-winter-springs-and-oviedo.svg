<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Line drawing of a winding road running from a shed at the upper left, past three pine trees and a small arched trail bridge, down to two storefronts at the lower right, with a clamshell of microgreens on a step at each end of the road">
  <rect width="1200" height="630" fill="#f5ead3"/>

  <!-- road, narrow at the shed end and wide at the town end -->
  <g fill="none" stroke="#5c4633" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M262 268 C 306 336 330 404 372 462 C 436 548 546 588 668 610"/>
    <path d="M312 258 C 380 330 438 404 512 466 C 610 548 748 586 892 604"/>
  </g>
  <g fill="none" stroke="#8a7e3a" stroke-width="5" stroke-linecap="round" stroke-dasharray="22 20">
