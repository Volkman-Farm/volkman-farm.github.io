  </g>

  <!-- shed at the top of the road -->
  <g fill="none" stroke="#1f2419" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M52 202 L 128 156 L 204 202"/>
    <path d="M72 202 V 278 M184 202 V 278"/>
    <path d="M72 202 H 184"/>
    <path d="M60 278 H 196"/>
    <rect x="112" y="222" width="36" height="56" rx="3"/>
