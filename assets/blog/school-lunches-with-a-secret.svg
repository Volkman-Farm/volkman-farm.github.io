<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Line drawing of an open lunchbox holding two wrap halves standing cut side up with microgreens showing in the spiral, a small apple, and a flat ice pack tucked along one side">
  <rect width="1200" height="630" fill="#f5ead3"/>

  <!-- open lid, hinged at the back -->
  <g fill="none" stroke="#5c4633" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M214 300 L 282 158 H 1058 L 990 300"/>
    <path d="M294 190 H 1046"/>
  </g>

  <!-- back rim and side walls of the box -->
  <g fill="none" stroke="#5c4633" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M204 318 C 400 292 800 292 996 318"/>
    <path d="M204 318 V 470"/>
    <path d="M996 318 V 470"/>
  </g>

  <!-- ice pack, tucked along the left side -->
  <g fill="none" stroke="#8a7e3a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="230" y="330" width="88" height="162" rx="20"/>
    <path d="M249 374 C 266 362 283 386 300 374"/>
    <path d="M249 410 C 266 398 283 422 300 410"/>
    <path d="M249 446 C 266 434 283 458 300 446"/>
  </g>

  <!-- back wrap half -->
  <g transform="translate(668,352) scale(0.86)">
    <g fill="none" stroke="#1f2419" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-95 0 V 132 C -95 156 -70 170 0 170 C 70 170 95 156 95 132 V 0"/>
      <ellipse cx="0" cy="0" rx="95" ry="40"/>
    </g>
    <g fill="none" stroke="#5c4633" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-95 0 A 95 40 0 0 1 95 0
               A 86 36 0 0 1 -78 0
               A 70 30 0 0 1 62 0
               A 54 23 0 0 1 -46 0
               A 38 16 0 0 1 30 0
               A 23 10 0 0 1 -16 0"/>
    </g>
    <g fill="none" stroke="#3a5a2a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 0 C 8 -9 21 -9 28 0 C 21 9 8 9 0 0" transform="translate(62,-14) rotate(-18)"/>
      <path d="M0 0 C 8 -9 21 -9 28 0 C 21 9 8 9 0 0" transform="translate(-84,10) rotate(14)"/>
      <path d="M0 0 C 7 -8 18 -8 24 0 C 18 8 7 8 0 0" transform="translate(30,20) rotate(8)"/>
      <path d="M0 0 C 7 -8 18 -8 24 0 C 18 8 7 8 0 0" transform="translate(-50,-20) rotate(-10)"/>
    </g>
  </g>

  <!-- front wrap half -->
  <g transform="translate(456,336)">
    <g fill="none" stroke="#1f2419" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-95 0 V 132 C -95 156 -70 170 0 170 C 70 170 95 156 95 132 V 0"/>
      <ellipse cx="0" cy="0" rx="95" ry="40"/>
    </g>
    <g fill="none" stroke="#5c4633" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-95 0 A 95 40 0 0 1 95 0
               A 86 36 0 0 1 -78 0
               A 70 30 0 0 1 62 0
               A 54 23 0 0 1 -46 0
               A 38 16 0 0 1 30 0
               A 23 10 0 0 1 -16 0"/>
    </g>
    <g fill="none" stroke="#3a5a2a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 0 C 8 -9 21 -9 28 0 C 21 9 8 9 0 0" transform="translate(60,12) rotate(16)"/>
      <path d="M0 0 C 8 -9 21 -9 28 0 C 21 9 8 9 0 0" transform="translate(-86,-8) rotate(-16)"/>
      <path d="M0 0 C 7 -8 18 -8 24 0 C 18 8 7 8 0 0" transform="translate(-44,18) rotate(12)"/>
      <path d="M0 0 C 7 -8 18 -8 24 0 C 18 8 7 8 0 0" transform="translate(26,-22) rotate(-8)"/>
      <path d="M0 0 C 6 -7 16 -7 21 0 C 16 7 6 7 0 0" transform="translate(-14,26) rotate(4)"/>
    </g>
  </g>

  <!-- apple -->
  <g fill="none" stroke="#6b2a2f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M870 344 C 912 334 944 368 944 408 C 944 450 916 482 878 482
             C 870 482 864 478 858 478 C 852 478 846 482 838 482
             C 800 482 772 450 772 408 C 772 368 804 334 846 344"/>
  </g>
  <g fill="none" stroke="#5c4633" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M858 344 C 858 328 860 316 864 306"/>
  </g>
  <g fill="none" stroke="#3a5a2a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M864 324 C 882 308 906 310 914 318 C 906 336 882 342 864 324"/>
  </g>

  <!-- front wall of the box, drawn over the contents so they sit inside -->
  <g fill="#f5ead3" stroke="#5c4633" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M204 452 C 400 482 800 482 996 452 V 490 C 996 518 974 536 944 536 H 256
             C 226 536 204 518 204 490 Z"/>
  </g>
  <g fill="none" stroke="#5c4633" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="566" y="486" width="68" height="34" rx="12"/>
  </g>

  <!-- two loose sprigs on the counter beside the box -->
  <g fill="none" stroke="#3a5a2a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(152,536) scale(0.56)">
      <path d="M0 0 C -22 -64 -28 -114 -16 -160"/>
      <path d="M-30 -104 C -62 -108 -76 -128 -72 -150 C -46 -148 -30 -128 -30 -104"/>
      <path d="M-34 -68 C -6 -74 8 -92 4 -112 C -18 -108 -34 -88 -34 -68"/>
    </g>
    <g transform="translate(1048,536) scale(0.5)">
      <path d="M0 0 C 22 -64 28 -114 16 -160"/>
      <path d="M30 -104 C 62 -108 76 -128 72 -150 C 46 -148 30 -128 30 -104"/>
      <path d="M34 -68 C 6 -74 -8 -92 -4 -112 C 18 -108 34 -88 34 -68"/>
    </g>
  </g>

  <!-- counter line -->
  <path d="M96 536 H 1104" fill="none" stroke="#5c4633" stroke-width="5" stroke-linecap="round"/>
</svg>
