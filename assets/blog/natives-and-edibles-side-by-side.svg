<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Line drawing of a clipboard holding a planting list with most lines crossed through, beside a squat pumpkin and a blueberry sprig">
  <rect width="1200" height="630" fill="#f5ead3"/>
  <path d="M120 560 H 1080" fill="none" stroke="#5c4633" stroke-width="8" stroke-linecap="round"/>

  <!-- clipboard -->
  <rect x="330" y="90" width="330" height="440" rx="14" fill="#f5ead3" stroke="#5c4633" stroke-width="8" stroke-linejoin="round"/>
  <rect x="430" y="70" width="130" height="44" rx="10" fill="#f5ead3" stroke="#1f2419" stroke-width="7"/>
  <!-- list lines -->
  <g fill="none" stroke="#1f2419" stroke-width="5" stroke-linecap="round">
    <path d="M378 160 H 600"/><path d="M378 196 H 580"/><path d="M378 232 H 610"/>
    <path d="M378 268 H 570"/><path d="M378 304 H 600"/><path d="M378 340 H 590"/>
    <path d="M378 376 H 560"/><path d="M378 412 H 604"/><path d="M378 448 H 584"/>
    <path d="M378 484 H 596"/>
  </g>
  <!-- strike-throughs -->
  <g fill="none" stroke="#6b2a2f" stroke-width="5" stroke-linecap="round">
    <path d="M370 162 L 612 156"/><path d="M370 198 L 592 192"/><path d="M370 234 L 620 228"/>
    <path d="M370 270 L 582 264"/><path d="M370 306 L 612 300"/><path d="M370 342 L 600 336"/>
    <path d="M370 378 L 572 372"/><path d="M370 486 L 606 480"/>
  </g>
  <!-- the two near misses, circled -->
  <g fill="none" stroke="#3a5a2a" stroke-width="5" stroke-linecap="round">
    <ellipse cx="490" cy="412" rx="134" ry="18"/>
    <ellipse cx="480" cy="448" rx="124" ry="18"/>
  </g>

  <!-- pumpkin -->
  <g fill="#f5ead3" stroke="#8a7e3a" stroke-width="7" stroke-linejoin="round">
    <ellipse cx="820" cy="490" rx="120" ry="70"/>
  </g>
  <g fill="none" stroke="#8a7e3a" stroke-width="5" stroke-linecap="round">
    <path d="M820 420 C 790 450 790 530 820 560"/>
    <path d="M820 420 C 850 450 850 530 820 560"/>
    <path d="M760 432 C 730 460 730 520 760 550"/>
    <path d="M880 432 C 910 460 910 520 880 550"/>
  </g>
  <path d="M820 420 C 818 400 826 388 840 380" fill="none" stroke="#5c4633" stroke-width="7" stroke-linecap="round"/>

  <!-- blueberry sprig -->
  <g fill="none" stroke="#5c4633" stroke-width="5" stroke-linecap="round">
    <path d="M200 560 C 210 480 240 420 280 380"/>
  </g>
  <g fill="none" stroke="#3a5a2a" stroke-width="5" stroke-linejoin="round">
    <path d="M236 440 C 196 430 184 404 196 392 C 222 396 238 416 236 440 Z"/>
    <path d="M262 400 C 290 372 318 374 322 390 C 304 408 280 412 262 400 Z"/>
  </g>
  <g fill="none" stroke="#1f2419" stroke-width="5">
    <circle cx="222" cy="480" r="16"/><circle cx="252" cy="490" r="16"/><circle cx="232" cy="512" r="16"/>
  </g>
</svg>
