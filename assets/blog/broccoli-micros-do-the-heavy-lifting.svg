    <!-- a bowl beside the tray, with the same greens scattered over it -->

    <!-- steam -->
    <g stroke="#8a7e3a" stroke-width="4">
      <path d="M902 336 c -16 -20, 16 -36, 0 -56"/>
      <path d="M950 322 c -16 -20, 16 -36, 0 -56"/>
      <path d="M998 336 c -16 -20, 16 -36, 0 -56"/>
    </g>

    <!-- bowl -->
    <g stroke="#1f2419">
      <path d="M832 386 C 840 452, 888 486, 950 486 C 1012 486, 1060 452, 1068 386"/>
