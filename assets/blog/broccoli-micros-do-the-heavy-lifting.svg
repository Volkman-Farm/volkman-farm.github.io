      <path d="M519 418 V 374"/>
      <ellipse cx="509" cy="369" rx="11" ry="7" transform="rotate(-22 509 369)"/>
      <ellipse cx="529" cy="369" rx="11" ry="7" transform="rotate(22 529 369)"/>
