    </g>

    <!-- greens scattered across the surface -->
    <g stroke="#3a5a2a" stroke-width="4">
      <path d="M886 386 V 358"/>
      <ellipse cx="875" cy="353" rx="12" ry="7" transform="rotate(-24 875 353)"/>
      <ellipse cx="897" cy="353" rx="12" ry="7" transform="rotate(24 897 353)"/>

      <path d="M932 390 V 356"/>
      <ellipse cx="921" cy="351" rx="12" ry="7" transform="rotate(-24 921 351)"/>
      <ellipse cx="943" cy="351" rx="12" ry="7" transform="rotate(24 943 351)"/>

      <path d="M978 390 V 360"/>
      <ellipse cx="967" cy="355" rx="12" ry="7" transform="rotate(-24 967 355)"/>
      <ellipse cx="989" cy="355" rx="12" ry="7" transform="rotate(24 989 355)"/>

      <path d="M1022 386 V 362"/>
      <ellipse cx="1011" cy="357" rx="12" ry="7" transform="rotate(-24 1011 357)"/>
      <ellipse cx="1033" cy="357" rx="12" ry="7" transform="rotate(24 1033 357)"/>
    </g>
    <g stroke="#8a7e3a" stroke-width="4">
      <path d="M909 392 V 374"/>
      <ellipse cx="900" cy="370" rx="10" ry="6" transform="rotate(-24 900 370)"/>
      <ellipse cx="918" cy="370" rx="10" ry="6" transform="rotate(24 918 370)"/>

      <path d="M1000 392 V 376"/>
      <ellipse cx="991" cy="372" rx="10" ry="6" transform="rotate(-24 991 372)"/>
      <ellipse cx="1009" cy="372" rx="10" ry="6" transform="rotate(24 1009 372)"/>
    </g>

  </g>
</svg>
