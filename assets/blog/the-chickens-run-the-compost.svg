<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Line drawing of two stacked spent microgreen trays outside a wire run, an arrow curving over the fence, two chickens scratching apart a slab of root mat, and a compost bin with larvae crawling out">
  <rect width="1200" height="630" fill="#f5ead3"/>
  <g fill="none" stroke="#3a5a2a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">

    <!-- sun, upper left -->
    <g stroke="#8a7e3a">
      <circle cx="160" cy="130" r="40"/>
      <path d="M160 66 V 52"/>
      <path d="M160 194 V 208"/>
      <path d="M96 130 H 82"/>
      <path d="M224 130 H 238"/>
      <path d="M114 84 L 104 74"/>
      <path d="M206 84 L 216 74"/>
      <path d="M114 176 L 104 186"/>
      <path d="M206 176 L 216 186"/>
    </g>

    <!-- run fence: posts, rails, wire -->
    <g stroke="#5c4633">
      <path d="M336 500 V 208" stroke-width="6"/>
      <path d="M1148 500 V 208" stroke-width="6"/>
      <path d="M742 500 V 208" stroke-width="5"/>
      <path d="M330 208 H 1154" stroke-width="6"/>
      <path d="M336 352 H 1148" stroke-width="3"/>
      <g stroke-width="2.5">
        <path d="M390 212 V 496"/>
        <path d="M444 212 V 496"/>
        <path d="M498 212 V 496"/>
        <path d="M552 212 V 496"/>
        <path d="M606 212 V 496"/>
        <path d="M660 212 V 496"/>
        <path d="M714 212 V 496"/>
        <path d="M796 212 V 496"/>
        <path d="M850 212 V 496"/>
        <path d="M904 212 V 496"/>
        <path d="M958 212 V 496"/>
        <path d="M1012 212 V 496"/>
        <path d="M1066 212 V 496"/>
        <path d="M1120 212 V 496"/>
      </g>
    </g>

    <!-- ground line -->
    <path d="M60 500 H 1160" stroke="#5c4633"/>

    <!-- stack of two spent trays, outside the run -->
    <g stroke="#1f2419">
      <!-- lower tray -->
      <path d="M118 500 v -42 h 168 v 42" fill="#f5ead3"/>
      <path d="M110 458 h 184" stroke-width="7"/>
      <!-- upper tray, offset -->
      <path d="M134 458 v -42 h 168 v 42" fill="#f5ead3"/>
      <path d="M126 416 h 184" stroke-width="7"/>
    </g>
    <!-- spent root mat packed in the top tray, cut stubble above the rim -->
    <g stroke="#8a7e3a" stroke-width="4">
      <path d="M144 438 h 148"/>
      <path d="M162 438 v 14 M190 438 v 16 M218 438 v 13 M246 438 v 16 M274 438 v 13"/>
      <path d="M162 414 v -11 M190 414 v -14 M218 414 v -9 M246 414 v -13 M274 414 v -10"/>
    </g>

    <!-- arrow: trays over the fence into the run -->
    <path d="M312 420 C 372 348 462 358 508 434"/>
    <path d="M508 434 l -20 -4 m 20 4 l -4 -20" stroke-width="4"/>

    <!-- slab of root mat on the ground, being scratched apart -->
    <g stroke="#8a7e3a" stroke-width="4">
      <path d="M436 500 C 452 458 534 454 566 500" stroke="#5c4633" stroke-width="5"/>
      <path d="M462 482 v -14 M488 472 v -16 M516 470 v -15 M542 480 v -13"/>
      <!-- loose bits kicked clear -->
      <path d="M398 494 c 6 -6 12 4 18 -1"/>
      <path d="M362 500 c 6 -6 12 4 18 -1"/>
      <path d="M584 496 c 6 -6 12 4 18 -1"/>
      <path d="M628 500 c 6 -6 12 4 18 -1"/>
    </g>

    <!-- hen one, facing the mat -->
    <g transform="translate(1130, 30) scale(-1, 1)">
      <path d="M470 430 C 452 430 440 416 442 400 C 420 396 414 378 424 366 C 434 380 448 384 452 382 C 458 360 486 348 512 356 C 526 340 548 340 556 344 C 552 352 548 360 546 368 C 556 382 556 402 544 416 C 528 434 492 438 470 430 Z" fill="#f5ead3"/>
      <path d="M528 344 c 2 -8 10 -10 14 -6 c 6 -6 14 -2 12 6" stroke="#6b2a2f" stroke-width="4"/>
      <circle cx="540" cy="356" r="2.5" fill="#3a5a2a"/>
      <path d="M556 358 l 14 5 l -14 6" stroke-width="4"/>
      <path d="M548 370 c 0 7 -8 9 -12 5" stroke="#6b2a2f" stroke-width="4"/>
      <path d="M470 386 C 486 380 504 384 510 396 C 500 406 482 406 472 398" stroke-width="4"/>
      <path d="M480 434 V 462 M480 462 l -10 8 M480 462 l 10 8 M480 462 v 8" stroke-width="4"/>
      <path d="M510 430 V 462 M510 462 l -10 8 M510 462 l 10 8 M510 462 v 8" stroke-width="4"/>
    </g>

    <!-- hen two, smaller, further back -->
    <g transform="translate(1285, 100) scale(-0.85, 0.85)">
      <path d="M470 430 C 452 430 440 416 442 400 C 420 396 414 378 424 366 C 434 380 448 384 452 382 C 458 360 486 348 512 356 C 526 340 548 340 556 344 C 552 352 548 360 546 368 C 556 382 556 402 544 416 C 528 434 492 438 470 430 Z" fill="#f5ead3"/>
      <path d="M528 344 c 2 -8 10 -10 14 -6 c 6 -6 14 -2 12 6" stroke="#6b2a2f" stroke-width="4"/>
      <circle cx="540" cy="356" r="2.5" fill="#3a5a2a"/>
      <path d="M556 358 l 14 5 l -14 6" stroke-width="4"/>
      <path d="M548 370 c 0 7 -8 9 -12 5" stroke="#6b2a2f" stroke-width="4"/>
      <path d="M470 386 C 486 380 504 384 510 396 C 500 406 482 406 472 398" stroke-width="4"/>
      <path d="M480 434 V 462 M480 462 l -10 8 M480 462 l 10 8 M480 462 v 8" stroke-width="4"/>
      <path d="M510 430 V 462 M510 462 l -10 8 M510 462 l 10 8 M510 462 v 8" stroke-width="4"/>
    </g>

    <!-- compost bin inside the run -->
    <g stroke="#5c4633">
      <path d="M980 500 v -102 h 132 v 102" fill="#f5ead3"/>
      <path d="M970 398 h 152" stroke-width="6"/>
      <path d="M998 430 h 96 M998 456 h 96" stroke-width="4"/>
      <!-- soldier fly above the bin -->
      <circle cx="1046" cy="344" r="6" stroke-width="4"/>
      <path d="M1040 340 c -8 -8 -18 -6 -20 0 M1052 340 c 8 -8 18 -6 20 0" stroke-width="4"/>
    </g>
    <!-- larvae climbing out and heading for the birds -->
    <g stroke="#8a7e3a" stroke-width="4">
      <path d="M962 474 c 6 -5 12 5 18 0"/>
      <path d="M930 486 c 6 -5 12 5 18 0"/>
      <path d="M898 496 c 6 -5 12 5 18 0"/>
    </g>

  </g>
</svg>
