    <path d="M322 462 C 318 448 320 438 326 430 M332 466 C 336 452 340 444 348 438"/>
    <path d="M1002 534 C 998 520 1000 510 1006 502 M1012 532 C 1016 518 1020 510 1028 504"/>
    <path d="M548 490 C 544 476 546 466 552 458"/>
