<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Line drawing of a yard in a rainstorm with slanted rain lines, a shed on a raised pad on high ground at the left, water standing in two low spots, and arrows tracing the flow downhill between planted mounds">
  <rect width="1200" height="630" fill="#f5ead3"/>

  <!-- rain -->
  <g fill="none" stroke="#8a7e3a" stroke-width="4" stroke-linecap="round">
    <path d="M120 44 l -26 86 M188 72 l -26 86 M256 50 l -26 86 M324 78 l -26 86
             M392 46 l -26 86 M460 74 l -26 86 M528 52 l -26 86 M596 80 l -26 86
             M664 44 l -26 86 M732 76 l -26 86 M800 48 l -26 86 M868 82 l -26 86
             M936 46 l -26 86 M1004 72 l -26 86 M1072 54 l -26 86 M1140 78 l -26 86"/>
    <path d="M156 176 l -26 86 M292 200 l -26 86 M428 182 l -26 86 M564 206 l -26 86
             M700 174 l -26 86 M836 202 l -26 86 M972 184 l -26 86 M1108 198 l -26 86"/>
    <path d="M440 304 l -22 72 M576 322 l -22 72 M712 300 l -22 72 M848 326 l -22 72
             M984 306 l -22 72 M1120 320 l -22 72"/>
  </g>

  <!-- ground profile -->
  <g fill="none" stroke="#5c4633" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M56 398 C 150 392 232 410 300 444
             C 344 466 370 498 402 514
             C 434 530 472 532 508 518
             C 540 506 562 478 590 460
             C 618 442 652 438 688 450
             C 728 462 758 500 798 526
             C 838 552 902 556 960 542
             C 1012 530 1078 490 1146 464"/>
  </g>

  <!-- standing water in the first low spot -->
  <g fill="none" stroke="#8a7e3a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M368 490 H 538"/>
    <path d="M396 506 h 40 M462 508 h 34 M414 520 h 46"/>
  </g>

  <!-- standing water in the second low spot -->
  <g fill="none" stroke="#8a7e3a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M756 518 H 994"/>
    <path d="M792 534 h 46 M866 536 h 40 M934 532 h 36 M820 548 h 52 M908 550 h 44"/>
  </g>

  <!-- shed on a raised pad, high ground at the left -->
  <g fill="none" stroke="#1f2419" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78 400 H 268"/>
    <path d="M96 400 V 418 M170 402 V 424 M248 404 V 430"/>
    <path d="M100 400 V 312 M244 400 V 312"/>
    <path d="M76 318 L 172 262 L 268 318"/>
    <path d="M100 318 H 244"/>
    <rect x="150" y="330" width="46" height="70" rx="3"/>
    <path d="M114 334 h 26 v 26 h -26 Z"/>
  </g>

  <!-- planted mound on the center rise -->
  <g fill="none" stroke="#5c4633" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M574 470 C 596 420 676 416 702 458"/>
  </g>
  <g fill="none" stroke="#3a5a2a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(618,424) scale(0.5)">
      <path d="M0 0 C -22 -64 -28 -114 -16 -160"/>
      <path d="M-30 -104 C -62 -108 -76 -128 -72 -150 C -46 -148 -30 -128 -30 -104"/>
      <path d="M-34 -68 C -6 -74 8 -92 4 -112 C -18 -108 -34 -88 -34 -68"/>
    </g>
    <g transform="translate(664,430) scale(0.4)">
      <path d="M0 0 C 22 -64 28 -114 16 -160"/>
      <path d="M30 -104 C 62 -108 76 -128 72 -150 C 46 -148 30 -128 30 -104"/>
      <path d="M34 -68 C 6 -74 -8 -92 -4 -112 C 18 -108 34 -88 34 -68"/>
    </g>
  </g>
  <!-- plantings on the right high ground -->
  <g fill="none" stroke="#3a5a2a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(1064,498) scale(0.46)">
      <path d="M0 0 C -22 -64 -28 -114 -16 -160"/>
      <path d="M-30 -104 C -62 -108 -76 -128 -72 -150 C -46 -148 -30 -128 -30 -104"/>
      <path d="M-34 -68 C -6 -74 8 -92 4 -112 C -18 -108 -34 -88 -34 -68"/>
    </g>
    <g transform="translate(1114,478) scale(0.36)">
      <path d="M0 0 C 22 -64 28 -114 16 -160"/>
      <path d="M30 -104 C 62 -108 76 -128 72 -150 C 46 -148 30 -128 30 -104"/>
      <path d="M34 -68 C 6 -74 -8 -92 -4 -112 C 18 -108 34 -88 34 -68"/>
