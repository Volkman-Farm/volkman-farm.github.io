<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Line drawing of two triangular sandwich halves standing on a plate, each showing a thick layer of microgreens in the cut face, with a knife lying beside the plate">
  <rect width="1200" height="630" fill="#f5ead3"/>

  <!-- plate -->
  <g fill="none" stroke="#1f2419" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="560" cy="512" rx="392" ry="86"/>
    <ellipse cx="560" cy="506" rx="306" ry="62"/>
  </g>

  <!-- left half, cut face toward us, crust on the left -->
  <g fill="none" stroke="#5c4633" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M286 472 V 246 L 638 472 Z" fill="#f5ead3"/>
  </g>
  <!-- the two bread faces, top and bottom of the cut -->
  <g fill="none" stroke="#5c4633" stroke-width="5" stroke-linecap="round">
    <path d="M290 340 H 442"/>
    <path d="M290 402 H 538"/>
  </g>
  <!-- meat layer -->
  <path d="M296 392 C 336 372 372 396 412 378 C 452 360 488 388 524 380" fill="none" stroke="#6b2a2f" stroke-width="6" stroke-linecap="round"/>
  <!-- microgreens filling the band between the bread faces -->
  <g fill="none" stroke="#3a5a2a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M312 392 C 314 370 322 358 336 352"/>
    <ellipse cx="326" cy="348" rx="22" ry="11" transform="rotate(-24 326 348)"/>
    <ellipse cx="356" cy="350" rx="22" ry="11" transform="rotate(20 356 350)"/>
    <path d="M382 396 C 384 374 392 362 406 356"/>
    <ellipse cx="396" cy="352" rx="22" ry="11" transform="rotate(-24 396 352)"/>
    <ellipse cx="426" cy="354" rx="22" ry="11" transform="rotate(20 426 354)"/>
    <path d="M452 400 C 454 382 462 372 474 368"/>
    <ellipse cx="466" cy="364" rx="20" ry="10" transform="rotate(-24 466 364)"/>
    <ellipse cx="492" cy="366" rx="20" ry="10" transform="rotate(20 492 366)"/>
  </g>

  <!-- right half, mirrored, crust on the right -->
  <g fill="none" stroke="#5c4633" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M966 472 V 268 L 668 472 Z" fill="#f5ead3"/>
  </g>
  <g fill="none" stroke="#5c4633" stroke-width="5" stroke-linecap="round">
    <path d="M962 352 H 840"/>
    <path d="M962 410 H 754"/>
  </g>
  <path d="M956 400 C 920 382 888 404 852 388 C 816 372 786 396 762 392" fill="none" stroke="#6b2a2f" stroke-width="6" stroke-linecap="round"/>
  <g fill="none" stroke="#3a5a2a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M934 400 C 932 380 924 368 910 362"/>
    <ellipse cx="920" cy="358" rx="22" ry="11" transform="rotate(24 920 358)"/>
    <ellipse cx="890" cy="360" rx="22" ry="11" transform="rotate(-20 890 360)"/>
    <path d="M864 404 C 862 384 854 374 840 368"/>
    <ellipse cx="850" cy="364" rx="22" ry="11" transform="rotate(24 850 364)"/>
    <ellipse cx="820" cy="366" rx="22" ry="11" transform="rotate(-20 820 366)"/>
    <path d="M794 408 C 792 392 784 382 772 378"/>
    <ellipse cx="780" cy="374" rx="20" ry="10" transform="rotate(24 780 374)"/>
    <ellipse cx="754" cy="376" rx="20" ry="10" transform="rotate(-20 754 376)"/>
  </g>

  <!-- knife lying beside the plate -->
  <g transform="rotate(-12 1060 560)" fill="none" stroke="#1f2419" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M954 546 L 1084 542 L 1084 574 L 972 574 Z"/>
    <path d="M1084 546 H 1160 C 1172 546 1172 570 1160 570 H 1084 Z"/>
  </g>
</svg>
