<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Line drawing of a grow shed at the left with a road running right past three front porches, each with a clamshell of microgreens set by the door, and a low sun rising behind the shed">
