<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Line drawing of two rack levels seen from the side, each with a pair of light bars above a tray of microgreens, and a short double headed arrow marking the gap between the bar and the leaves">
