    <path d="M612 300 C 608 276 612 262 622 252 M612 300 C 616 278 624 266 636 258"/>
    <path d="M676 300 C 672 278 676 264 686 254 M676 300 C 680 280 688 268 700 260"/>
    <path d="M740 300 C 736 276 740 262 750 252 M740 300 C 744 278 752 266 764 258"/>
    <path d="M804 300 C 800 278 804 264 814 254 M804 300 C 808 280 816 268 828 260"/>
