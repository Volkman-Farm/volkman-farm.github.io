    <path d="M104 324 H 188 L 184 376 H 108 Z"/>
    <path d="M228 324 H 328 L 328 376 H 226 Z"/>
    <path d="M364 324 H 464 L 468 376 H 364 Z"/>
    <path d="M112 416 H 184 L 180 476 H 118 Z"/>
