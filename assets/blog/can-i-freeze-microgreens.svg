<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Line drawing of an ice cube tray with green puree in the compartments, set beside a clamshell of fresh microgreens">
  <rect width="1200" height="630" fill="#f5ead3"/>

  <!-- clamshell of fresh greens, right -->
  <g fill="none" stroke="#5c4633" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M756 396 H 1112 L 1136 500 H 732 Z"/>
    <path d="M756 396 L 792 288 H 1076 L 1112 396"/>
  </g>
  <path d="M744 448 H 1124" fill="none" stroke="#5c4633" stroke-width="4"/>
  <g fill="none" stroke="#3a5a2a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M834 396 C 836 348 848 320 866 306"/>
    <ellipse cx="852" cy="300" rx="28" ry="14" transform="rotate(-24 852 300)"/>
    <ellipse cx="894" cy="302" rx="28" ry="14" transform="rotate(22 894 302)"/>
    <path d="M934 396 C 936 340 948 310 966 294"/>
    <ellipse cx="952" cy="288" rx="28" ry="14" transform="rotate(-24 952 288)"/>
    <ellipse cx="994" cy="290" rx="28" ry="14" transform="rotate(22 994 290)"/>
    <path d="M1034 396 C 1036 348 1048 320 1066 308"/>
    <ellipse cx="1052" cy="302" rx="28" ry="14" transform="rotate(-24 1052 302)"/>
    <ellipse cx="1094" cy="304" rx="28" ry="14" transform="rotate(22 1094 304)"/>
  </g>

  <!-- ice cube tray, left, seen at a slight angle -->
