<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Line drawing of a shed shelf holding a watering can, a tray of microgreens, and a seed packet, with a magnifying glass held over the tray showing the shoots enlarged">
  <defs>
    <g id="shoot" fill="none" stroke="#3a5a2a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 0 C -3 -24 3 -42 0 -60"/>
      <path d="M0 -60 C -20 -65 -31 -78 -28 -93 C -9 -89 0 -74 0 -60"/>
      <path d="M0 -60 C 20 -65 31 -78 28 -93 C 9 -89 0 -74 0 -60"/>
    </g>
    <clipPath id="lens">
      <circle cx="470" cy="312" r="104"/>
    </clipPath>
  </defs>

  <rect width="1200" height="630" fill="#f5ead3"/>

  <!-- shelf plank the whole setup sits on -->
  <g fill="none" stroke="#5c4633" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M70 478 H 1130"/>
    <path d="M70 478 V 502 H 1130 V 478"/>
    <path d="M232 502 V 630 M968 502 V 630"/>
  </g>

  <!-- shallow tray -->
  <g fill="none" stroke="#5c4633" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M420 398 H 740 L 792 440 H 368 Z"/>
    <path d="M368 440 L 384 478 H 776 L 792 440"/>
  </g>

  <!-- soil bed inside the tray -->
  <path d="M436 404 H 724 L 766 434 H 394 Z" fill="#5c4633" fill-opacity="0.13" stroke="#5c4633" stroke-width="3"/>

  <!-- the stand of microgreens at ordinary size -->
  <g>
    <use href="#shoot" transform="translate(446,414) scale(0.86)"/>
    <use href="#shoot" transform="translate(502,410) scale(0.94)"/>
    <use href="#shoot" transform="translate(556,414) scale(0.88)"/>
    <use href="#shoot" transform="translate(610,410) scale(0.96)"/>
    <use href="#shoot" transform="translate(664,414) scale(0.9)"/>
    <use href="#shoot" transform="translate(716,416) scale(0.84)"/>
    <use href="#shoot" transform="translate(530,430) scale(1)"/>
    <use href="#shoot" transform="translate(586,432) scale(1.04)"/>
    <use href="#shoot" transform="translate(642,430) scale(0.98)"/>
    <use href="#shoot" transform="translate(696,432) scale(0.92)"/>
  </g>

  <!-- jug of filtered water, left of the tray -->
  <g fill="none" stroke="#5c4633" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- body -->
    <rect x="140" y="368" width="120" height="110" rx="16"/>
    <!-- neck and cap -->
    <path d="M180 368 V 340 H 220 V 368"/>
    <rect x="172" y="322" width="56" height="20" rx="6"/>
    <!-- carry handle looping off the right side -->
    <path d="M260 392 q 36 8 36 38 q 0 30 -36 38"/>
  </g>
  <!-- water drop marked on the jug -->
  <path d="M200 392 C 214 414 224 428 224 441 A 24 24 0 0 1 176 441 C 176 428 186 414 200 392 Z"
        fill="none" stroke="#8a7e3a" stroke-width="5" stroke-linejoin="round"/>

  <!-- seed packet standing at the right end of the shelf -->
  <g fill="none" stroke="#3a5a2a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M872 478 L 866 326 L 996 314 L 1008 466 Z"/>
    <path d="M866 326 l 16 11 l 18 -11 l 18 11 l 19 -11 l 18 11 l 17 -11" stroke-width="3"/>
    <g stroke="#8a7e3a" stroke-width="5">
      <path d="M936 428 V 376"/>
      <path d="M936 392 c -22 -3 -33 -18 -33 -33 c 20 0 33 13 33 33"/>
      <path d="M936 386 c 22 -3 33 -18 33 -33 c -20 0 -33 13 -33 33"/>
    </g>
  </g>

  <!-- magnifying glass: handle first so the lens sits over its end -->
  <g fill="none" stroke="#5c4633" stroke-linecap="round">
    <path d="M398 240 L 306 148" stroke-width="15"/>
    <path d="M332 174 L 296 138" stroke-width="25"/>
  </g>

  <!-- lens body, filled cream so what is inside reads as glass -->
  <circle cx="470" cy="312" r="104" fill="#f5ead3" stroke="#1f2419" stroke-width="8"/>

  <!-- soil line and the same shoots drawn larger, both clipped to the lens -->
  <g clip-path="url(#lens)">
    <path d="M350 400 H 596" fill="none" stroke="#5c4633" stroke-width="6" stroke-linecap="round"/>
    <use href="#shoot" transform="translate(414,400) scale(1.3)"/>
    <use href="#shoot" transform="translate(482,402) scale(1.42)"/>
    <use href="#shoot" transform="translate(548,400) scale(1.26)"/>
  </g>

  <!-- inner rim of the glass -->
  <circle cx="470" cy="312" r="90" fill="none" stroke="#8a7e3a" stroke-width="3"/>
</svg>
