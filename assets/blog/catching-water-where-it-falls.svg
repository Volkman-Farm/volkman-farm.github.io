<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Line drawing of a hillside cross section with a level swale ditch and berm, a mulched basin dished around a planted mound, and a barrel catching runoff from a shed roof">
  <rect width="1200" height="630" fill="#f5ead3"/>

  <!-- rain across the top -->
  <g fill="none" stroke="#8a7e3a" stroke-width="4" stroke-linecap="round">
    <path d="M120 56 l -22 70 M206 82 l -22 70 M292 54 l -22 70 M378 86 l -22 70
             M464 58 l -22 70 M550 88 l -22 70 M636 56 l -22 70 M722 84 l -22 70
             M808 60 l -22 70 M894 90 l -22 70 M980 58 l -22 70 M1066 86 l -22 70
             M1152 62 l -22 70"/>
    <path d="M420 186 l -20 62 M556 208 l -20 62 M692 184 l -20 62 M828 210 l -20 62
             M964 188 l -20 62 M1100 206 l -20 62"/>
  </g>

  <!-- shed corner with roof, gutter and downspout -->
  <g fill="none" stroke="#1f2419" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M48 246 L 152 188 L 256 246"/>
    <path d="M78 246 V 358"/>
    <path d="M228 246 V 372"/>
    <path d="M78 246 H 228"/>
    <path d="M240 250 H 268"/>
    <path d="M262 254 V 296 H 306"/>
    <path d="M118 282 h 34 v 34 h -34 Z"/>
  </g>

  <!-- rain barrel under the downspout -->
  <g fill="none" stroke="#1f2419" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M292 300 V 372 C 292 382 306 388 334 388 C 362 388 376 382 376 372 V 300"/>
    <ellipse cx="334" cy="300" rx="42" ry="12"/>
    <path d="M294 330 C 314 338 354 338 374 330"/>
    <path d="M294 358 C 314 366 354 366 374 358"/>
  </g>
  <g fill="none" stroke="#8a7e3a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M300 316 C 318 322 350 322 368 316"/>
  </g>

  <!-- ground profile: slope, swale trench and berm, basin, mound -->
  <g fill="none" stroke="#5c4633" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M52 336 L 300 388 L 468 414
             L 500 456 L 612 456 L 644 414
             C 666 390 708 388 728 418
             L 864 464
             C 888 472 902 494 930 498
             C 958 502 974 492 990 476
             C 1010 440 1094 434 1126 490
             L 1156 504"/>
  </g>

  <!-- water standing in the swale, and a dashed level line through it -->
  <g fill="none" stroke="#8a7e3a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M506 444 H 606"/>
    <path d="M524 458 h 32 M572 456 h 26"/>
  </g>
  <g fill="none" stroke="#8a7e3a" stroke-width="4" stroke-linecap="round" stroke-dasharray="14 12">
    <path d="M452 444 H 676"/>
  </g>

  <!-- mulch over the berm -->
  <g fill="none" stroke="#5c4633" stroke-width="5" stroke-linecap="round">
    <path d="M662 388 l 20 -6 M694 384 l 20 -4 M672 404 l 18 -6 M706 400 l 18 -6"/>
  </g>

  <!-- mulch filling the basin on the uphill side of the mound -->
  <g fill="none" stroke="#5c4633" stroke-width="5" stroke-linecap="round">
    <path d="M886 476 l 20 -6 M916 484 l 20 -5 M948 486 l 20 -6
             M898 494 l 18 -5 M932 498 l 18 -5 M962 490 l 18 -6"/>
  </g>

  <!-- planting on the mound -->
  <g fill="none" stroke="#3a5a2a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(1042,442) scale(0.56)">
      <path d="M0 0 C -22 -64 -28 -114 -16 -160"/>
      <path d="M-30 -104 C -62 -108 -76 -128 -72 -150 C -46 -148 -30 -128 -30 -104"/>
      <path d="M-34 -68 C -6 -74 8 -92 4 -112 C -18 -108 -34 -88 -34 -68"/>
    </g>
    <g transform="translate(1094,450) scale(0.44)">
      <path d="M0 0 C 22 -64 28 -114 16 -160"/>
      <path d="M30 -104 C 62 -108 76 -128 72 -150 C 46 -148 30 -128 30 -104"/>
      <path d="M34 -68 C 6 -74 -8 -92 -4 -112 C 18 -108 34 -88 34 -68"/>
    </g>
  </g>

  <!-- runoff arrows heading downhill into the swale and the basin -->
  <g fill="none" stroke="#1f2419" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M404 368 C 434 380 456 392 470 408"/>
    <path d="M466 386 L 472 408 L 452 400"/>
    <path d="M792 414 C 822 426 844 438 858 456"/>
    <path d="M854 434 L 860 456 L 840 448"/>
  </g>

  <!-- water sinking down out of the swale and the basin -->
  <g fill="none" stroke="#8a7e3a" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 12">
    <path d="M534 474 V 520 M580 474 V 520"/>
    <path d="M916 516 V 558 M958 514 V 556"/>
  </g>
</svg>
