             M1038 64 l -16 -16 M1134 160 l 16 16 M1134 64 l 16 -16 M1038 160 l -16 16"/>
  </g>

  <!-- dressing pooled at the bottom of the jar -->
  <g fill="none" stroke="#8a7e3a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M430 478 C 470 468 512 486 556 476 C 600 466 644 484 688 474 C 720 467 748 480 770 472"/>
    <path d="M472 504 h 40 M560 512 h 46 M660 500 h 38 M496 524 h 34 M622 526 h 42"/>
  </g>

  <!-- hard vegetable layer -->
  <g fill="none" stroke="#5c4633" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="486" cy="436" r="24"/>
    <circle cx="486" cy="436" r="10"/>
    <circle cx="634" cy="432" r="26"/>
    <circle cx="634" cy="432" r="11"/>
    <circle cx="706" cy="446" r="20"/>
    <circle cx="706" cy="446" r="8"/>
    <circle cx="524" cy="406" r="10"/>
    <circle cx="596" cy="398" r="10"/>
    <circle cx="672" cy="402" r="10"/>
    <circle cx="742" cy="410" r="9"/>
    <circle cx="452" cy="404" r="9"/>
