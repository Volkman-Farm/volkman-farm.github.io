<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Line drawing of a wide mouth glass jar packed in layers with dressing at the bottom, chopped vegetables, a grain layer, and microgreens crowning the top, with the lid resting on one side, a fork on the other, and a small sun in the corner">
  <rect width="1200" height="630" fill="#f5ead3"/>

  <!-- sun, upper right -->
  <g fill="none" stroke="#8a7e3a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="1086" cy="112" r="38"/>
