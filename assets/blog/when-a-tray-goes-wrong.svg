<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Line drawing of two growing trays side by side, one with an even stand of microgreens and one with bare gaps between thin patches, with a wheelbarrow standing behind them">
