    <ellipse cx="286" cy="392" rx="26" ry="13" transform="rotate(-24 286 392)"/>
    <ellipse cx="216" cy="440" rx="26" ry="13" transform="rotate(-18 216 440)"/>
    <ellipse cx="150" cy="462" rx="24" ry="12" transform="rotate(-10 150 462)"/>
