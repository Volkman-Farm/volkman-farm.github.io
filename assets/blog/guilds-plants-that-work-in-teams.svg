  <!-- low herb clump on the left shoulder -->
  <g fill="none" stroke="#8a7e3a" stroke-width="6" stroke-linecap="round">
    <path d="M660 312 C 658 282 664 262 678 244"/>
    <path d="M676 312 C 680 284 692 266 710 252"/>
    <path d="M694 312 C 700 288 714 272 734 262"/>
