    <path d="M561 260 L 522 226 M561 244 L 604 214"/>
    <path d="M561 214 C 496 214 462 178 468 146 C 474 114 512 96 546 108 C 560 78 606 74 626 100 C 664 92 692 122 682 156 C 674 186 632 214 561 214 Z"/>
  </g>
  <g fill="none" stroke="#6b2a2f" stroke-width="6" stroke-linecap="round">
    <circle cx="512" cy="160" r="11"/>
    <circle cx="606" cy="140" r="11"/>
    <circle cx="646" cy="174" r="11"/>
  </g>

  <!-- shrub on the right shoulder -->
  <g fill="none" stroke="#3a5a2a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
