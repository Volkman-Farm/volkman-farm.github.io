    <ellipse cx="1010" cy="330" rx="30" ry="14" transform="rotate(18 1010 330)"/>
    <ellipse cx="938" cy="298" rx="30" ry="14" transform="rotate(-18 938 298)"/>
  </g>
  <g fill="none" stroke="#8a7e3a" stroke-width="6" stroke-linecap="round">
    <circle cx="968" cy="228" r="26"/>
    <path d="M968 194 V 176 M968 262 V 280 M934 228 H 916 M1002 228 H 1020 M944 204 L 931 191 M992 204 L 1005 191 M944 252 L 931 265 M992 252 L 1005 265"/>
