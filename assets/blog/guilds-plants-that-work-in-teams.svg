<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Line drawing of a planted mound in cross section with a small fruit tree at the top, a shrub beside it, a tall flower, a vining ground cover spilling down the sides, and roots drawn below the soil line">
