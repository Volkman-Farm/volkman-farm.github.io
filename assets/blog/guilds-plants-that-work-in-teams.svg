  <g fill="none" stroke="#5c4633" stroke-width="4" stroke-linecap="round" opacity="0.55">
    <path d="M150 540 h 70 M270 566 h 58 M400 528 h 64 M700 548 h 66 M840 574 h 56 M960 534 h 62"/>
  </g>

  <!-- roots under the tree -->
