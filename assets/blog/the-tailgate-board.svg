<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Line drawing of the back of an SUV with the hatch raised and a wooden board of sliders, dip, and cheese on the cargo floor, beside a folding table holding a small bowl of microgreens set in a larger bowl of ice">
  <rect width="1200" height="630" fill="#f5ead3"/>
  <path d="M100 578 H 1100" fill="none" stroke="#5c4633" stroke-width="8" stroke-linecap="round"/>

  <!-- tires -->
  <g fill="none" stroke="#1f2419" stroke-width="8">
    <circle cx="218" cy="524" r="54"/><circle cx="562" cy="524" r="54"/>
    <circle cx="218" cy="524" r="17"/><circle cx="562" cy="524" r="17"/>
  </g>
  <!-- body -->
  <path d="M150 470 V 230 Q 150 210 170 210 H 610 Q 630 210 630 230 V 470 Z" fill="#f5ead3" stroke="#1f2419" stroke-width="8" stroke-linejoin="round"/>
  <rect x="150" y="470" width="480" height="30" rx="10" fill="#f5ead3" stroke="#1f2419" stroke-width="8"/>
  <rect x="210" y="254" width="360" height="216" rx="8" fill="none" stroke="#1f2419" stroke-width="8"/>
  <g fill="none" stroke="#6b2a2f" stroke-width="7">
    <rect x="166" y="290" width="30" height="100" rx="6"/><rect x="584" y="290" width="30" height="100" rx="6"/>
  </g>
  <!-- hatch raised -->
  <g fill="#f5ead3" stroke="#1f2419" stroke-width="8" stroke-linejoin="round">
    <path d="M214 202 L 566 202 L 532 76 L 260 76 Z"/>
  </g>

  <!-- board on the cargo floor -->
  <rect x="226" y="446" width="328" height="20" rx="6" fill="#f5ead3" stroke="#5c4633" stroke-width="7"/>
  <!-- sliders -->
  <g fill="#f5ead3" stroke="#5c4633" stroke-width="6" stroke-linejoin="round">
    <path d="M244 446 V 430 H 304 V 446"/><path d="M240 430 C 240 404 308 404 308 430 Z"/>
    <path d="M318 446 V 430 H 378 V 446"/><path d="M314 430 C 314 404 382 404 382 430 Z"/>
  </g>
  <g fill="none" stroke="#3a5a2a" stroke-width="4" stroke-linecap="round">
    <path d="M246 432 c 5 -7 10 0 15 -5 c 5 7 10 0 15 -5 c 5 7 10 0 15 -5 c 5 6 8 0 12 -3"/>
    <path d="M320 432 c 5 -7 10 0 15 -5 c 5 7 10 0 15 -5 c 5 7 10 0 15 -5 c 5 6 8 0 12 -3"/>
  </g>
  <!-- dip -->
  <path d="M398 414 H 470 C 468 436 452 446 434 446 C 416 446 400 436 398 414 Z" fill="#f5ead3" stroke="#1f2419" stroke-width="6" stroke-linejoin="round"/>
  <path d="M406 414 C 420 404 448 404 462 414" fill="none" stroke="#8a7e3a" stroke-width="5" stroke-linecap="round"/>
  <!-- cheese -->
  <g fill="#f5ead3" stroke="#8a7e3a" stroke-width="6" stroke-linejoin="round">
    <path d="M484 446 L 506 416 L 540 446 Z"/>
  </g>

  <!-- folding table -->
  <path d="M760 400 H 1040" fill="none" stroke="#5c4633" stroke-width="10" stroke-linecap="round"/>
  <g fill="none" stroke="#5c4633" stroke-width="7" stroke-linecap="round">
    <path d="M790 400 L 1010 578"/><path d="M1010 400 L 790 578"/>
  </g>
  <!-- ice bowl with greens bowl inside -->
  <path d="M810 300 H 990 C 986 358 948 398 900 398 C 852 398 814 358 810 300 Z" fill="#f5ead3" stroke="#1f2419" stroke-width="7" stroke-linejoin="round"/>
  <g fill="none" stroke="#5c4633" stroke-width="4" stroke-linejoin="round">
    <path d="M822 302 l 16 -16 l 16 16"/><path d="M946 302 l 14 -14 l 14 14"/>
  </g>
  <path d="M852 300 H 948 C 946 332 926 350 900 350 C 874 350 854 332 852 300 Z" fill="#f5ead3" stroke="#1f2419" stroke-width="6" stroke-linejoin="round"/>
  <g fill="none" stroke="#3a5a2a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M874 300 C 870 282 880 272 890 276"/><path d="M900 300 V 268"/>
    <path d="M900 268 C 893 260 899 252 907 256"/><path d="M926 300 C 930 282 920 272 910 276"/>
  </g>
</svg>
